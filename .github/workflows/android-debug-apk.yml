name: Android debug APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - "contracts/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Rename APK with version and commit
        id: apk
        run: |
          version="${{ github.ref_name }}"
          sha="${GITHUB_SHA:0:7}"
          name="open-eos-control-${version}-${sha}-debug.apk"
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "path=android/app/build/outputs/apk/debug/${name}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
